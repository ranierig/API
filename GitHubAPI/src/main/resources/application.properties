spring.application.name=githubapi
api.url= https://api.github.com
path.url= /users
mapping.url = /api/github/users
spring.profiles.active=prd
server.servlet.context-path= /

logging.level.root = INFO
#logging.file.name=logs/app-${spring.application.name}-${spring.application.instance_id}-${current.date}.log
#logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger : %msg%n

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
